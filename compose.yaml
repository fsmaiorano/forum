services:
  forum:
    image: forum
    container_name: forumapi
    build:
      context: .
      dockerfile: src/Forum/Dockerfile
    ports:
      - "6000:8080"
      - "6060:8081"
    networks:
      - forum-network
  notification:
    image: notification
    container_name: notificationapi
    build:
      context: .
      dockerfile: src/Notification/Dockerfile
    ports:
      - "6001:8080"
      - "6061:8081"
    networks:
      - forum-network
  user:
    image: user
    container_name: userapi
    build:
      context: .
      dockerfile: src/User/Dockerfile
    ports:
      - "6002:8080"
      - "6062:8081"
    environment:
      - ConnectionStrings__DefaultConnection=Host=userdb;Port=5432;Database=UserDb;Username=postgres;Password=postgres
    networks:
      - forum-network
  userdb:
    image: postgres
    container_name: userdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=UserDb
    restart: always
    ports:
      - "5435:5432"
    volumes:
      - postgres_user:/var/lib/postgresql
    networks:
      - forum-network
volumes:
  postgres_user:
networks:
  forum-network:
    driver: bridge
  

